<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&I WORLD - 新图加载 等你组队</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-blue: #3EAAF4;
            --grid-line: rgba(255, 255, 255, 0.4);
            --pink: #F36EA6;
            --pink-shadow: #D84D88;
            --yellow: #FFE033;
            --black: #1A1A1A;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'ZCOOL KuaiLe', cursive;
            background-color: var(--bg-blue);
            background-image: 
                linear-gradient(var(--grid-line) 2px, transparent 2px),
                linear-gradient(90deg, var(--grid-line) 2px, transparent 2px);
            background-size: 40px 40px;
            color: var(--black);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .title-banner {
            background: var(--white);
            border: 4px solid var(--black);
            padding: 10px 20px;
            margin-bottom: 30px;
            position: relative;
            transform: rotate(-2deg);
            box-shadow: 6px 6px 0px var(--yellow), 10px 10px 0px var(--black);
        }

        .title-banner h1 {
            margin: 0;
            font-size: 32px;
            color: var(--black);
            text-align: center;
            letter-spacing: 2px;
        }

        .window-box {
            background: var(--white);
            border: 4px solid var(--black);
            box-shadow: 8px 8px 0px var(--pink), 12px 12px 0px var(--black);
            width: 90%;
            max-width: 420px;
            position: relative;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .window-header {
            background: var(--pink);
            border-bottom: 4px solid var(--black);
            padding: 8px 15px;
            color: var(--white);
            font-size: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-shadow: 2px 2px 0px var(--black);
        }

        .window-header .dots {
            display: flex;
            gap: 6px;
        }
        .window-header .dot {
            width: 12px;
            height: 12px;
            background: var(--white);
            border: 2px solid var(--black);
            border-radius: 50%;
        }

        .window-content {
            padding: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 20px;
            margin-bottom: 8px;
            color: var(--black);
        }

        input {
            width: 100%;
            padding: 12px;
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 18px;
            background: #F4F4F4;
            border: 4px solid var(--black);
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            background: var(--white);
            border-color: var(--pink);
        }

        .btn {
            background: var(--yellow);
            color: var(--black);
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 24px;
            padding: 12px;
            width: 100%;
            border: 4px solid var(--black);
            box-shadow: 4px 4px 0px var(--black);
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.1s;
        }

        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--black);
        }

        #result-screen {
            display: none;
            text-align: center;
        }

        .result-title {
            font-size: 24px;
            margin-bottom: 10px;
            color: var(--black);
        }

        .dept-name {
            font-size: 36px;
            color: var(--pink);
            text-shadow: 2px 2px 0px var(--black);
            margin: 20px 0;
            background: var(--white);
            display: inline-block;
            padding: 10px 20px;
            border: 4px solid var(--black);
            transform: rotate(2deg);
        }

        .qr-placeholder {
            width: 240px;
            height: 240px;
            background: var(--white);
            border: 4px solid var(--black);
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #666;
            font-size: 16px;
            overflow: hidden;
        }

        .qr-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .sticker {
            position: absolute;
            background: var(--yellow);
            border: 3px solid var(--black);
            padding: 4px 10px;
            font-size: 16px;
            transform: rotate(-10deg);
            top: -15px;
            left: -15px;
            box-shadow: 2px 2px 0px var(--black);
            z-index: 10;
        }

        .dialog-text {
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 20px;
            text-align: left;
            border: 2px dashed #ccc;
            padding: 10px;
            background: #fafafa;
        }

    </style>
</head>
<body>

    <div class="title-banner">
        <h1>新图加载 等你组队</h1>
    </div>

    <div class="window-box" id="login-screen">
        <div class="sticker">招新</div>
        <div class="window-header">
            <span>D&I WORLD</span>
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
        <div class="window-content">
            <div class="dialog-text">
                > 您收到一条匹配邀请... <br>
                > 输入信息查看录取部门：
            </div>

            <div class="form-group">
                <label for="studentName">姓名</label>
                <input type="text" id="studentName" placeholder="请输入你的姓名" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="studentId">学号</label>
                <input type="text" id="studentId" placeholder="请输入你的学号" autocomplete="off">
            </div>

            <button class="btn" onclick="startMatch()">开始匹配</button>
        </div>
    </div>

    <div class="window-box" id="result-screen">
        <div class="window-header" style="background: var(--bg-blue);">
            <span>MATCHED!</span>
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
        <div class="window-content">
            <div class="result-title">
                恭喜玩家 <span id="res-name" style="color:var(--pink);"></span>！<br>

            </div>
            
            <div class="dept-name">
